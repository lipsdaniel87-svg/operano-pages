<body>
  <h1>Zurück zu Operano</h1>
  <p>Kopiere die vollständige Adresse aus der Adresszeile deines Browsers.</p>
  <p>Füge sie in Operano unter „Rückkehr-Adresse“ ein
     und klicke auf „Freigabe übernehmen“.</p>
  <p>Behandle diese Adresse vertraulich und teile sie nicht mit anderen.</p>
